name: kit self-test

on: [push, pull_request]

jobs:
  install-and-guard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - stack: web-ts
            roots: "src/, tests/"
            marker: package.json
          - stack: flutter
            roots: "lib/, test/"
            marker: pubspec.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n install.sh
          for f in stacks/*/execution/*.sh; do bash -n "$f"; done

      - name: Build a fixture project
        run: |
          mkdir -p /tmp/fixture
          cd /tmp/fixture
          git init -q .
          touch "${{ matrix.marker }}"

      - name: Install the kit
        run: ./install.sh --stack ${{ matrix.stack }} /tmp/fixture

      # The headline install is `curl ... | bash`, where BASH_SOURCE is not a file and the
      # script has to clone itself. Exercised against this checkout so the bootstrap branch
      # is covered without hitting the network.
      - name: One-liner path (piped, self-cloning)
        run: |
          set -e
          mkdir -p /tmp/piped && cd /tmp/piped && git init -q . && touch "${{ matrix.marker }}"
          cat "$GITHUB_WORKSPACE/install.sh" \
            | DOE_KIT_REPO="$GITHUB_WORKSPACE" DOE_KIT_REF="$(git -C "$GITHUB_WORKSPACE" rev-parse --abbrev-ref HEAD)" \
              bash -s -- --stack ${{ matrix.stack }}
          test -f .doe/execution/directive_guard.py
          test -d .claude/skills/directive
          .doe/execution/guard_selftest.py

      - name: Guard is armed, with the right roots
        working-directory: /tmp/fixture
        run: |
          .doe/execution/directive_guard.py --status | tee status.txt
          grep -q "protected:.*${{ matrix.roots }}" status.txt
          grep -q "GUARD: ARMED" status.txt

      # The guard is the only component that, when it breaks, turns nothing red — it just
      # stops protecting. This is the step that notices.
      - name: Guard self-test
        working-directory: /tmp/fixture
        run: .doe/execution/guard_selftest.py

      - name: Lifecycle — DRAFT blocks, APPROVED unlocks, deletion re-arms
        working-directory: /tmp/fixture
        run: |
          set -e
          printf '# d\n\nSTATE: DRAFT\n' > .doe/directives/01_x.md
          .doe/execution/directive_guard.py --status | grep -q "GUARD: ARMED"

          printf '# d\n\nSTATE: APPROVED\n' > .doe/directives/01_x.md
          .doe/execution/directive_guard.py --status | grep -q "GUARD: UNLOCKED"

          rm .doe/directives/01_x.md
          .doe/execution/directive_guard.py --status | grep -q "GUARD: ARMED"

      # A globally enabled plugin must not make every unrelated repo read-only.
      - name: Guard is dormant outside a DOE project
        run: |
          set -e
          mkdir -p /tmp/plain && cd /tmp/plain && git init -q .
          out=$(echo '{"tool_name":"Write","tool_input":{"file_path":"src/x.ts"},"cwd":"/tmp/plain"}' \
            | python3 "$GITHUB_WORKSPACE/core/execution/directive_guard.py")
          [ -z "$out" ] || { echo "guard spoke up in a non-DOE project: $out"; exit 1; }
          echo "dormant, as it should be"

      - name: Installer is idempotent and never clobbers
        run: |
          ./install.sh --stack ${{ matrix.stack }} /tmp/fixture | tee second.txt
          grep -q "hook already wired" second.txt
          grep -q "skip" second.txt

      # Every skill needs frontmatter to be discoverable at all, and a skill that silently
      # fails to load looks exactly like a skill the agent chose not to use.
      - name: Installed skills have valid frontmatter
        working-directory: /tmp/fixture
        run: |
          set -e
          count=0
          for f in .claude/skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$'      || { echo "no frontmatter: $f"; exit 1; }
            sed -n '2p' "$f" | grep -q '^name:'  || { echo "no name: $f"; exit 1; }
            sed -n '3p' "$f" | grep -q '^description:' || { echo "no description: $f"; exit 1; }
            count=$((count + 1))
          done
          echo "$count skills, all with frontmatter"
          [ "$count" -ge 9 ]

      # /review is the bundled alias for /code-review, and a project skill never overrides
      # a bundled alias — it would be shadowed silently when typed. Same trap for any other
      # bundled name.
      - name: No skill name collides with a bundled command
        working-directory: /tmp/fixture
        run: |
          set -e
          RESERVED="review code-review simplify run init loop verify batch debug doctor dataviz"
          for d in .claude/skills/*/; do
            name=$(basename "$d")
            for r in $RESERVED; do
              [ "$name" = "$r" ] && { echo "skill '$name' collides with bundled '$r'"; exit 1; }
            done
          done
          echo "no collisions"

      # Three of the Flutter skills refuse to run without .doe/conventions.json. If the
      # example ever stops shipping, they fail closed on a real project instead of here.
      - name: Stack conventions template ships and parses
        if: matrix.stack == 'flutter'
        working-directory: /tmp/fixture
        run: |
          test -f .doe/conventions.example.json
          python3 -c "import json,sys; json.load(open('.doe/conventions.example.json'))"
          test ! -f .doe/conventions.json   # never pre-filled: a guessed design system is worse than none
          for s in riverpod-architect scaffold-feature fix-style test-plan test-run; do
            test -f ".claude/skills/$s/SKILL.md" || { echo "missing skill: $s"; exit 1; }
          done

  i18n-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validator catches drift, lost placeholders, overflow
        run: |
          cd /tmp
          V=$GITHUB_WORKSPACE/skills/i18n-translator/scripts/validate.py
          printf '{"a":"Accedi","b":"Ciao {name}","c":" e poi"}\n'   > src.json
          printf '{"a":"Log in","b":"Hi {name}","c":" then"}\n'      > ok.json
          printf '{"a":"Authenticate now","b":"Hi {nome}"}\n'        > bad.json
          python3 "$V" src.json ok.json
          if python3 "$V" src.json bad.json; then
            echo "validator passed a broken file"; exit 1
          fi

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests parse and agree
        run: |
          set -e
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          plugin = json.load(open('.claude-plugin/plugin.json'))
          market = json.load(open('.claude-plugin/marketplace.json'))
          entry = next(p for p in market['plugins'] if p['name'] == plugin['name'])
          assert entry['version'] == plugin['version'], \
              f"version drift: marketplace {entry['version']} vs plugin {plugin['version']}"
          print(f"{plugin['name']} {plugin['version']} — manifests agree")
          PY

      # Only plugin.json belongs in .claude-plugin/; skills/, hooks/ and the rest live at
      # the plugin root. Getting this wrong loads a plugin with nothing in it.
      - name: Plugin layout
        run: |
          set -e
          test -f hooks/hooks.json
          test -d skills
          for d in .claude-plugin/skills .claude-plugin/hooks .claude-plugin/commands; do
            test ! -e "$d" || { echo "$d must live at the plugin root"; exit 1; }
          done
          python3 -c "import json; json.load(open('hooks/hooks.json'))"
          grep -q 'CLAUDE_PLUGIN_ROOT' hooks/hooks.json

      # Every skill named by a manifest must exist, and every skill must be reachable from
      # one of them — otherwise the installer and the plugin ship different sets.
      - name: Skill manifests cover the skills tree
        run: |
          set -e
          listed=$(cat core/skills.txt stacks/*/skills.txt 2>/dev/null | sed 's/#.*//' | tr -d ' ' | grep -v '^$' | sort)
          present=$(ls -1 skills | sort)
          for name in $listed; do
            test -d "skills/$name" || { echo "manifest lists missing skill: $name"; exit 1; }
          done
          # `init` is plugin-only: the standalone installer already does what it does.
          unlisted=$(comm -13 <(echo "$listed") <(echo "$present") | grep -v '^init$' || true)
          [ -z "$unlisted" ] || { echo "skills not in any manifest: $unlisted"; exit 1; }
          echo "$(echo "$listed" | wc -l) listed, $(echo "$present" | wc -l) present"

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n bench/selftest.sh
          for f in bench/tasks/*/verify.sh; do bash -n "$f"; done

      # The task itself has to discriminate, or every arm scores the same and the benchmark
      # measures nothing. Fixture green, reference solution accepted, wrong answer rejected.
      - name: Reference task discriminates
        run: |
          set -e
          T=bench/tasks/T01_volume_discounts
          cp -r "$T/fixture" /tmp/ref && cp -r "$T/fixture" /tmp/wrong
          (cd /tmp/ref && python3 -m unittest discover -s tests -t .)
          cp bench/selftest/solutions/reference.py /tmp/ref/src/pricing.py
          cp bench/selftest/solutions/broken.py    /tmp/wrong/src/pricing.py
          "$T/verify.sh" /tmp/ref > /dev/null
          if "$T/verify.sh" /tmp/wrong > /dev/null 2>&1; then
            echo "the hidden suite accepted a wrong implementation"; exit 1
          fi
          echo "hidden suite accepts the reference and rejects the wrong answer"

      # The scorer shares the guard's failure mode: when it breaks it turns nothing red, it
      # just stops discriminating. This is the step that notices.
      - name: Scorer self-test
        run: ./bench/selftest.sh

      - name: Arms and tasks parse, and the runner wires them up
        run: |
          set -e
          for f in bench/arms/*.json bench/tasks/*/task.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          ./bench/run.py --dry-run --arms A0_baseline,A1_baseline_rich,A2_doe,A3_baseline_matched --seeds 1
