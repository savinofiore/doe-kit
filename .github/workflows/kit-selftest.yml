name: kit self-test

on: [push, pull_request]

jobs:
  install-and-guard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - stack: web-ts
            roots: "src/, tests/"
            marker: package.json
          - stack: flutter
            roots: "lib/, test/"
            marker: pubspec.yaml
          - stack: python
            roots: "src/, tests/"
            marker: pyproject.toml
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n install.sh
          for f in stacks/*/execution/*.sh; do bash -n "$f"; done

      # A stack registers itself through stack.json alone. A descriptor that is missing,
      # malformed or disagrees with its directory name makes the installer fall back to the
      # wrong protected roots — the guard then watches a directory nobody writes to, which
      # looks exactly like a guard that works.
      - name: Stack descriptors are complete and consistent
        run: |
          python3 - stacks/*/ <<'PY'
          import json, sys
          from pathlib import Path

          required = {"name", "label", "markers", "protected_roots", "conventions"}
          for raw in sys.argv[1:]:
              d = Path(raw)
              if d.name == "shared":
                  continue
              descriptor = d / "stack.json"
              assert descriptor.is_file(), f"{d} has no stack.json"
              data = json.loads(descriptor.read_text())
              missing = required - data.keys()
              assert not missing, f"{descriptor}: missing {sorted(missing)}"
              assert data["name"] == d.name, f"{descriptor}: name != directory"
              assert data["markers"], f"{descriptor}: no markers"
              assert data["protected_roots"], f"{descriptor}: no protected_roots"
              has_example = (d / "conventions.example.json").is_file()
              assert data["conventions"] == has_example, \
                  f"{descriptor}: conventions={data['conventions']} but example {'exists' if has_example else 'is missing'}"
              assert (d / "README.md").is_file(), f"{d}: no README.md"
              assert "## Gate" in (d / "README.md").read_text(), \
                  f"{d}/README.md has no '## Gate' section — the installer copies it into .doe/README.md"
              for script in ("run.sh", "coverage.sh"):
                  assert (d / "execution" / script).is_file(), f"{d}: no execution/{script}"
              print(f"{data['name']:<10} ok — roots {data['protected_roots']}")
          PY

      - name: Build a fixture project
        run: |
          mkdir -p /tmp/fixture
          cd /tmp/fixture
          git init -q .
          touch "${{ matrix.marker }}"

      - name: Install the kit
        run: ./install.sh --stack ${{ matrix.stack }} /tmp/fixture

      # The headline install is `curl ... | bash`, where BASH_SOURCE is not a file and the
      # script has to clone itself. Exercised against this checkout so the bootstrap branch
      # is covered without hitting the network.
      - name: One-liner path (piped, self-cloning)
        run: |
          set -e
          mkdir -p /tmp/piped && cd /tmp/piped && git init -q . && touch "${{ matrix.marker }}"
          # On pull_request the workspace is a detached HEAD, so there is no branch name to
          # clone by. Name the commit under test ourselves.
          git -C "$GITHUB_WORKSPACE" branch -f ci-selftest HEAD
          cat "$GITHUB_WORKSPACE/install.sh" \
            | DOE_KIT_REPO="$GITHUB_WORKSPACE" DOE_KIT_REF=ci-selftest \
              bash -s -- --stack ${{ matrix.stack }}
          test -f .doe/execution/directive_guard.py
          test -d .claude/skills/directive
          test -d .codex/skills/directive
          test -f .codex/hooks.json
          .doe/execution/guard_selftest.py

      - name: Installed roots match the descriptor
        run: |
          python3 - "stacks/${{ matrix.stack }}/stack.json" /tmp/fixture/.doe/doe.config.json <<'PY'
          import json, sys
          declared = json.load(open(sys.argv[1]))["protected_roots"]
          installed = json.load(open(sys.argv[2]))["protected_roots"]
          assert declared == installed, f"descriptor says {declared}, installer wrote {installed}"
          print("roots agree:", installed)
          PY

      - name: Guard is armed, with the right roots
        working-directory: /tmp/fixture
        run: |
          .doe/execution/directive_guard.py --status | tee status.txt
          grep -q "protected:.*${{ matrix.roots }}" status.txt
          grep -q "GUARD: ARMED" status.txt

      # The guard is the only component that, when it breaks, turns nothing red — it just
      # stops protecting. This is the step that notices.
      - name: Guard self-test
        working-directory: /tmp/fixture
        run: .doe/execution/guard_selftest.py

      - name: Lifecycle — DRAFT blocks, APPROVED unlocks, deletion re-arms
        working-directory: /tmp/fixture
        run: |
          set -e
          printf '# d\n\nSTATE: DRAFT\n' > .doe/directives/01_x.md
          .doe/execution/directive_guard.py --status | grep -q "GUARD: ARMED"

          printf '# d\n\nSTATE: APPROVED\n' > .doe/directives/01_x.md
          .doe/execution/directive_guard.py --status | grep -q "GUARD: UNLOCKED"

          rm .doe/directives/01_x.md
          .doe/execution/directive_guard.py --status | grep -q "GUARD: ARMED"

      # A globally enabled plugin must not make every unrelated repo read-only.
      - name: Guard is dormant outside a DOE project
        run: |
          set -e
          mkdir -p /tmp/plain && cd /tmp/plain && git init -q .
          out=$(echo '{"tool_name":"Write","tool_input":{"file_path":"src/x.ts"},"cwd":"/tmp/plain"}' \
            | python3 "$GITHUB_WORKSPACE/core/execution/directive_guard.py")
          [ -z "$out" ] || { echo "guard spoke up in a non-DOE project: $out"; exit 1; }
          echo "dormant, as it should be"

      - name: Installer is idempotent and never clobbers
        run: |
          ./install.sh --stack ${{ matrix.stack }} /tmp/fixture | tee second.txt
          grep -q "hook already wired" second.txt
          grep -q "skip" second.txt

      # Every skill needs frontmatter to be discoverable at all, and a skill that silently
      # fails to load looks exactly like a skill the agent chose not to use.
      - name: Installed skills have valid frontmatter
        working-directory: /tmp/fixture
        run: |
          set -e
          count=0
          for f in .claude/skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$'      || { echo "no frontmatter: $f"; exit 1; }
            sed -n '2p' "$f" | grep -q '^name:'  || { echo "no name: $f"; exit 1; }
            sed -n '3p' "$f" | grep -q '^description:' || { echo "no description: $f"; exit 1; }
            count=$((count + 1))
          done
          echo "$count skills, all with frontmatter"
          [ "$count" -ge 9 ]

      - name: Codex skills have valid frontmatter
        working-directory: /tmp/fixture
        run: |
          set -e
          for f in .codex/skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "no frontmatter: $f"; exit 1; }
            sed -n '2p' "$f" | grep -q '^name:' || { echo "no name: $f"; exit 1; }
          done

      - name: Codex hook targets Codex write tools
        working-directory: /tmp/fixture
        run: |
          python3 - <<'PY'
          import json
          hooks = json.load(open('.codex/hooks.json'))['hooks']['PreToolUse']
          entry = next(h for h in hooks if 'directive_guard.py' in str(h))
          assert entry['matcher'] == 'apply_patch|exec_command'
          PY

      # /review is the bundled alias for /code-review, and a project skill never overrides
      # a bundled alias — it would be shadowed silently when typed. Same trap for any other
      # bundled name.
      - name: No skill name collides with a bundled command
        working-directory: /tmp/fixture
        run: |
          set -e
          RESERVED="review code-review simplify run init loop verify batch debug doctor dataviz"
          for d in .claude/skills/*/; do
            name=$(basename "$d")
            for r in $RESERVED; do
              [ "$name" = "$r" ] && { echo "skill '$name' collides with bundled '$r'"; exit 1; }
            done
          done
          echo "no collisions"

      # Three of the Flutter skills refuse to run without .doe/conventions.json. If the
      # example ever stops shipping, they fail closed on a real project instead of here.
      - name: Stack conventions template ships and parses
        if: matrix.stack == 'flutter'
        working-directory: /tmp/fixture
        run: |
          test -f .doe/conventions.example.json
          python3 -c "import json,sys; json.load(open('.doe/conventions.example.json'))"
          test ! -f .doe/conventions.json   # never pre-filled: a guessed design system is worse than none
          for s in riverpod-architect scaffold-feature fix-style test-plan test-run; do
            test -f ".claude/skills/$s/SKILL.md" || { echo "missing skill: $s"; exit 1; }
          done

  # The per-file coverage check shares the guard's failure mode: when it breaks it turns
  # nothing red, it just stops discriminating — and a gate that passes every file is a gate
  # that reports green on untested code. This is the step that notices. It runs the parser
  # exactly as it ships, extracted from coverage.sh rather than copied.
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python coverage check discriminates
        run: |
          set -e
          mkdir -p /tmp/cov && cd /tmp/cov
          sed -n "/<<'PY'/,/^PY\$/p" "$GITHUB_WORKSPACE/stacks/python/execution/coverage.sh" \
            | sed '1d;$d' > parser.py
          test -s parser.py

          cat > coverage.xml <<'XML'
          <?xml version="1.0" ?>
          <coverage><packages><package><classes>
            <class filename="src/full.py"><lines>
              <line number="1" hits="1"/><line number="2" hits="1"/>
            </lines></class>
            <class filename="src/half.py"><lines>
              <line number="1" hits="1"/><line number="2" hits="0"/>
            </lines></class>
            <class filename="src/empty.py"><lines></lines></class>
          </classes></package></packages></coverage>
          XML

          # A file below the threshold, and a file the suite never imported, must both be red.
          out=$(DOE_FILES=$'src/full.py\nsrc/half.py\nsrc/empty.py\nsrc/ghost.py\n' \
                DOE_MIN=80 DOE_XML=coverage.xml python3 parser.py) && rc=0 || rc=$?
          echo "$out"
          [ "$rc" -eq 1 ]                              || { echo "under-threshold file passed"; exit 1; }
          echo "$out" | grep -q '✗ src/half.py'        || { echo "50% not flagged at min 80"; exit 1; }
          echo "$out" | grep -q '✗ src/ghost.py'       || { echo "unreported file not flagged"; exit 1; }
          echo "$out" | grep -q '⊘ src/empty.py'       || { echo "zero-line file not skipped"; exit 1; }

          # ...and a suite that meets the threshold must not be failed by the check itself.
          DOE_FILES=$'src/full.py\n' DOE_MIN=80 DOE_XML=coverage.xml python3 parser.py \
            || { echo "the check failed a file at 100%"; exit 1; }

          # coverage.py writes paths relative to each <source> root, so the lookup has to
          # match on suffix as well as on equality.
          cat > rel.xml <<'XML'
          <?xml version="1.0" ?>
          <coverage><packages><package><classes>
            <class filename="half.py"><lines>
              <line number="1" hits="1"/><line number="2" hits="0"/>
            </lines></class>
          </classes></package></packages></coverage>
          XML
          DOE_FILES=$'src/half.py\n' DOE_MIN=40 DOE_XML=rel.xml python3 parser.py \
            || { echo "package-relative path not matched"; exit 1; }

          echo "coverage check discriminates"

  i18n-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validator catches drift, lost placeholders, overflow
        run: |
          cd /tmp
          V=$GITHUB_WORKSPACE/skills/i18n-translator/scripts/validate.py
          printf '{"a":"Accedi","b":"Ciao {name}","c":" e poi"}\n'   > src.json
          printf '{"a":"Log in","b":"Hi {name}","c":" then"}\n'      > ok.json
          printf '{"a":"Authenticate now","b":"Hi {nome}"}\n'        > bad.json
          python3 "$V" src.json ok.json
          if python3 "$V" src.json bad.json; then
            echo "validator passed a broken file"; exit 1
          fi

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests parse and agree
        run: |
          set -e
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          plugin = json.load(open('.claude-plugin/plugin.json'))
          market = json.load(open('.claude-plugin/marketplace.json'))
          entry = next(p for p in market['plugins'] if p['name'] == plugin['name'])
          assert entry['version'] == plugin['version'], \
              f"version drift: marketplace {entry['version']} vs plugin {plugin['version']}"
          print(f"{plugin['name']} {plugin['version']} — manifests agree")
          PY

      - name: Codex manifest and marketplace agree
        run: |
          set -e
          python3 - <<'PY'
          import json
          plugin = json.load(open('.codex-plugin/plugin.json'))
          market = json.load(open('.agents/plugins/marketplace.json'))
          entry = next(p for p in market['plugins'] if p['name'] == plugin['name'])
          assert entry['source'] == {'source': 'local', 'path': './'}
          assert plugin['skills'] == './skills/'
          print(f"{plugin['name']} Codex manifests agree")
          PY

      # Only plugin.json belongs in .claude-plugin/; skills/, hooks/ and the rest live at
      # the plugin root. Getting this wrong loads a plugin with nothing in it.
      - name: Plugin layout
        run: |
          set -e
          test -f hooks/hooks.json
          test -d skills
          for d in .claude-plugin/skills .claude-plugin/hooks .claude-plugin/commands; do
            test ! -e "$d" || { echo "$d must live at the plugin root"; exit 1; }
          done
          python3 -c "import json; json.load(open('hooks/hooks.json'))"
          grep -q 'CLAUDE_PLUGIN_ROOT' hooks/hooks.json

      # The fixture check covers what the installer copies. This one covers the source tree,
      # because a skill can shadow a bundled command without ever reaching a fixture — and a
      # shadowed command fails silently, by running the wrong thing.
      #
      # `init` is the one deliberate exception: no manifest lists it, so the installer never
      # copies it, and the plugin exposes it namespaced as /doe-kit:init. Renaming it to
      # doe-init would make the plugin command /doe-kit:doe-init to fix a collision that
      # cannot happen. The exception is written down here so the next one is a decision
      # rather than an oversight.
      - name: No skill in the tree shadows a bundled command
        run: |
          set -e
          RESERVED="review code-review simplify run loop verify batch debug doctor dataviz init"
          NAMESPACED_ONLY="init"
          listed=$(cat core/skills.txt stacks/*/skills.txt 2>/dev/null | sed 's/#.*//' | tr -d ' ' | grep -v '^$')
          for d in skills/*/; do
            name=$(basename "$d")
            for r in $RESERVED; do
              [ "$name" = "$r" ] || continue
              case " $NAMESPACED_ONLY " in
                *" $name "*)
                  # Allowed only while no manifest installs it under its bare name.
                  echo "$listed" | grep -qx "$name" \
                    && { echo "'$name' shadows bundled '$r' AND a manifest installs it"; exit 1; }
                  echo "  $name: namespaced-only, not installed — allowed"
                  ;;
                *) echo "skill '$name' collides with bundled '$r'"; exit 1 ;;
              esac
            done
          done
          echo "no unintended collisions"

      # Every skill named by a manifest must exist, and every skill must be reachable from
      # one of them — otherwise the installer and the plugin ship different sets.
      - name: Skill manifests cover the skills tree
        run: |
          set -e
          listed=$(cat core/skills.txt stacks/*/skills.txt 2>/dev/null | sed 's/#.*//' | tr -d ' ' | grep -v '^$' | sort)
          present=$(ls -1 skills | sort)
          for name in $listed; do
            test -d "skills/$name" || { echo "manifest lists missing skill: $name"; exit 1; }
          done
          # `init` is plugin-only: the standalone installer already does what it does.
          unlisted=$(comm -13 <(echo "$listed") <(echo "$present") | grep -v '^init$' || true)
          [ -z "$unlisted" ] || { echo "skills not in any manifest: $unlisted"; exit 1; }
          echo "$(echo "$listed" | wc -l) listed, $(echo "$present" | wc -l) present"

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n bench/selftest.sh
          for f in bench/tasks/*/verify.sh; do bash -n "$f"; done

      # The task itself has to discriminate, or every arm scores the same and the benchmark
      # measures nothing. Fixture green, reference solution accepted, wrong answer rejected.
      - name: Reference task discriminates
        run: |
          set -e
          T=bench/tasks/T01_volume_discounts
          cp -r "$T/fixture" /tmp/ref && cp -r "$T/fixture" /tmp/wrong
          (cd /tmp/ref && python3 -m unittest discover -s tests -t .)
          cp bench/selftest/solutions/reference.py /tmp/ref/src/pricing.py
          cp bench/selftest/solutions/broken.py    /tmp/wrong/src/pricing.py
          "$T/verify.sh" /tmp/ref > /dev/null
          if "$T/verify.sh" /tmp/wrong > /dev/null 2>&1; then
            echo "the hidden suite accepted a wrong implementation"; exit 1
          fi
          echo "hidden suite accepts the reference and rejects the wrong answer"

      # The scorer shares the guard's failure mode: when it breaks it turns nothing red, it
      # just stops discriminating. This is the step that notices.
      - name: Scorer self-test
        run: ./bench/selftest.sh

      - name: Arms and tasks parse, and the runner wires them up
        run: |
          set -e
          for f in bench/arms/*.json bench/tasks/*/task.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          ./bench/run.py --dry-run --arms A0_baseline,A1_baseline_rich,A2_doe,A3_baseline_matched --seeds 1
