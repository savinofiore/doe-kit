<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="DOE Kit — Directive Oriented Execution">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 66px; font-weight: 700; letter-spacing: 2px; fill: #e6edf3; }
    .sub   { font-size: 21px; font-weight: 500; letter-spacing: 3px; fill: #7c8cff; }
    .tag   { font-size: 17px; fill: #9198a1; }
    .code  { font-size: 15.5px; fill: #9198a1; }
    .ok    { fill: #3fb950; }
    .bad   { fill: #f85149; }
    .key   { fill: #e6edf3; font-weight: 600; }
  </style>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="7" height="298" rx="3.5" fill="#7c8cff"/>

  <text class="mono title" x="60" y="118">DOE KIT</text>
  <text class="mono sub"   x="64" y="156">DIRECTIVE · ORIENTED · EXECUTION</text>
  <text class="mono tag"   x="64" y="206">No code until the spec is approved.</text>
  <text class="mono tag"   x="64" y="232">&#8220;Done&#8221; is an exit code, not a claim.</text>

  <rect x="620" y="46" width="520" height="208" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <line x1="620" y1="86" x2="1140" y2="86" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="646" cy="66" r="5.5" fill="#f85149"/>
  <circle cx="666" cy="66" r="5.5" fill="#d29922"/>
  <circle cx="686" cy="66" r="5.5" fill="#3fb950"/>
  <text class="mono code" x="712" y="71" fill="#9198a1">.doe/execution/run.sh</text>

  <text class="mono code" y="122"><tspan class="key" x="646">$ /directive</tspan><tspan x="800">spec + Test Contract, no code</tspan></text>
  <text class="mono code" y="152" x="646"><tspan class="bad">&#10007;</tspan> write to src/ refused &#8212; GUARD: ARMED</text>
  <text class="mono code" y="182"><tspan class="key" x="646">$ /execute 07</tspan><tspan x="800">RED &#8594; fix &#8594; GREEN</tspan></text>
  <text class="mono code" y="212"><tspan class="ok" x="646">&#10003; gate passed</tspan><tspan x="800">exit 0 &#8212; directive deleted</tspan></text>
</svg>
